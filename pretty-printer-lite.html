<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON Pretty Printer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    /* --- NAVBAR --- */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #007bff;
      color: white;
      padding: 12px 20px;
    }
    .navbar .brand {
      font-size: 20px;
      font-weight: bold;
    }
    .navbar .profile {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #007bff;
      font-weight: bold;
      cursor: pointer;
    }

    /* --- MAIN CONTAINER --- */
    .container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }
    textarea {
      flex-grow: 1;
      width: 100%;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: none;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    button {
      flex-grow: 1;
      margin: 5px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .options {
      margin-top: 5px;
      display: flex;
      justify-content: space-between; /* left = message, right = radios */
      align-items: center;
    }
    .options label {
      margin-left: 10px;
    }
    .message {
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="brand">JSON Pretty Printer</div>
    <div class="profile">👤</div>
  </div>

  <!-- Main App -->
  <div class="container">
    <textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea>

    <div class="controls">
      <button onclick="formatJson()">Format JSON</button>
      <button onclick="uglyfyJson()">Uglyfy JSON</button>
      <button onclick="resetJson()">Reset</button>
      <button onclick="copyJson()">Copy to Clipboard</button>
    </div>

    <div class="options">
      <div class="message" id="message"></div>
      <div>
        Indentation:
        <label><input type="radio" name="indent" value="2" checked> 2 spaces</label>
        <label><input type="radio" name="indent" value="4"> 4 spaces</label>
        <label><input type="radio" name="indent" value="8"> 8 spaces</label>
      </div>
    </div>
  </div>

  <script>
    function getIndent() {
      const radios = document.getElementsByName('indent');
      for (let r of radios) {
        if (r.checked) return parseInt(r.value);
      }
      return 2;
    }

    function formatJson() {
      const input = document.getElementById('jsonInput');
      try {
        const obj = JSON.parse(input.value);
        input.value = JSON.stringify(obj, null, getIndent());
        showMessage("Formatted successfully!", "lightgreen");
      } catch (e) {
        showMessage("Invalid JSON!", "red");
      }
    }

    function uglyfyJson() {
      const input = document.getElementById('jsonInput');
      try {
        const obj = JSON.parse(input.value);
        input.value = JSON.stringify(obj); // compact mode
        showMessage("Uglyfied successfully!", "lightgreen");
      } catch (e) {
        showMessage("Invalid JSON!", "red");
      }
    }

    function resetJson() {
      document.getElementById('jsonInput').value = '';
      hideMessage();
    }

    function copyJson() {
      const input = document.getElementById('jsonInput');
      input.select();
      document.execCommand('copy');
      showMessage("Copied to clipboard!", "lightgreen");
    }

    function showMessage(text, color) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.style.color = color;
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 5000);
    }

    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }
  </script>
</body>
</html>
